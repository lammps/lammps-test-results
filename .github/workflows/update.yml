# Ingest new test results from lammps/lammps, rebuild the status website,
# deploy it to GitHub Pages, and update the rolling status issue.
name: "Update Test Status Site"

on:
  schedule:
    # twice a day: the full regression results are published as a single
    # "latest" file per configuration on download.lammps.org, so a run that
    # is not picked up before the next one replaces it is lost.  the test
    # machine runs at most once every 24 h and only when the monitored
    # branch has changed, which makes the time of day it publishes drift;
    # polling every 12 h keeps the margin.  the unit test run published by
    # the same machine (junit.xml, next to the coverage report) is picked up
    # on the same schedule and for the same reason.  so are the coverage and
    # static analysis summaries from it, the manual build status (rebuilt
    # hourly at 23 minutes past), and the GitHub Actions unit test artifacts
    - cron: '45 9,21 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # pin to the branch tip explicitly: the default ref is the commit SHA
      # that triggered the run, which does NOT advance if a failed job is
      # re-run, so a retry after a partial success (data already committed
      # and pushed) would redo the commit against a stale base and get its
      # push rejected
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      # pull new post-merge artifacts from lammps/lammps, archive the latest
      # full regression results, and refresh the scraped external summaries
      # (not on push events, those only rebuild the site after code or data
      # changes)
      - name: Ingest new results
        id: ingest
        if: ${{ github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ingest_actions.py --repo lammps/lammps --datadir data
          python3 tools/fetch_regression.py --datadir data
          python3 tools/fetch_unittest.py --datadir data
          python3 tools/scrape_coverity.py --output data/external/coverity.json
          python3 tools/fetch_external.py --datadir data
          python3 tools/fetch_activity.py --output data/external/activity.json
          python3 tools/fetch_docs.py --output data/external/docs.json

      - name: Commit new data
        if: ${{ github.event_name != 'push' }}
        run: |
          if [ -n "$(git status --porcelain data)" ]
          then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "ingest new test results"
            git push
          fi

      - name: Build website
        run: python3 generator/build_site.py --datadir data --outdir _site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # the artifact name includes the attempt number so that re-running a
      # failed deployment does not trip deploy-pages over duplicate artifacts
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # updating an issue in another repository (e.g. lammps/lammps 5071 as set
      # in the STATUS_ISSUE_REPO / STATUS_ISSUE_NUMBER repository variables)
      # needs a token with issue write permission there in the ISSUE_TOKEN secret;
      # tolerate failure so a missing secret does not fail the whole update
      - name: Update status issue
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ISSUE_TOKEN || github.token }}
        run: |
          python3 tools/update_issue.py \
                 --repo "${{ vars.STATUS_ISSUE_REPO || github.repository }}" \
                 --issue "${{ vars.STATUS_ISSUE_NUMBER || 0 }}" \
                 --site-url "${{ steps.deployment.outputs.page_url }}" \
                 --datadir data
